<!doctype html>
<html lang="en">
  <head>
    <!-- =====================================================
         DOCUMENT SETTINGS
    ====================================================== -->

    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="theme-color"
      content="#071A2B"
    />

    <meta
      name="color-scheme"
      content="light"
    />


    <!-- =====================================================
         PRIMARY SEO
    ====================================================== -->

    <title>
      Continental Founders | Connecting African Founders to Global Opportunity
    </title>

    <meta
      name="description"
      content="Continental Founders connects African founders with universities, mentors, business leaders, investors, markets, and global opportunity networks through entrepreneurship, collaboration, and venture development."
    />

    <meta
      name="author"
      content="Continental Founders"
    />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <meta
      name="googlebot"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />


    <!-- =====================================================
         CANONICAL
    ====================================================== -->

    <link
      rel="canonical"
      href="https://continentalfounders.org/"
    />


    <!-- =====================================================
         FAVICON / BRAND ICON
    ====================================================== -->

    <link
      rel="icon"
      type="image/png"
      href="/assets/continental-founders-logo.png"
    />

    <link
      rel="apple-touch-icon"
      href="/assets/continental-founders-logo.png"
    />


    <!-- =====================================================
         OPEN GRAPH
    ====================================================== -->

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="Continental Founders"
    />

    <meta
      property="og:title"
      content="Continental Founders | Connecting African Founders to Global Opportunity"
    />

    <meta
      property="og:description"
      content="Connecting African founders with universities, mentors, business leaders, investors, markets, and global opportunity networks."
    />

    <meta
      property="og:url"
      content="https://continentalfounders.org/"
    />

    <meta
      property="og:image"
      content="https://continentalfounders.org/assets/continental-founders-logo.png"
    />

    <meta
      property="og:image:secure_url"
      content="https://continentalfounders.org/assets/continental-founders-logo.png"
    />

    <meta
      property="og:image:alt"
      content="Continental Founders"
    />

    <meta
      property="og:locale"
      content="en_US"
    />


    <!-- =====================================================
         X / TWITTER
    ====================================================== -->

    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Continental Founders | Connecting African Founders to Global Opportunity"
    />

    <meta
      name="twitter:description"
      content="Connecting African founders with universities, mentors, business leaders, investors, markets, and global opportunity networks."
    />

    <meta
      name="twitter:image"
      content="https://continentalfounders.org/assets/continental-founders-logo.png"
    />

    <meta
      name="twitter:image:alt"
      content="Continental Founders"
    />


    <!-- =====================================================
         PERFORMANCE
    ====================================================== -->

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />


    <!-- =====================================================
         TYPOGRAPHY
    ====================================================== -->

    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap"
      rel="stylesheet"
    />


    <!-- =====================================================
         STRUCTURED DATA — ORGANIZATION
    ====================================================== -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "@id": "https://continentalfounders.org/#organization",
        "name": "Continental Founders",
        "alternateName": "Continental Founders™",
        "url": "https://continentalfounders.org/",
        "logo": {
          "@type": "ImageObject",
          "url": "https://continentalfounders.org/assets/continental-founders-logo.png"
        },
        "description": "Continental Founders connects African founders with universities, mentors, business leaders, investors, markets, and global opportunity networks through entrepreneurship, collaboration, and venture development.",
        "areaServed": [
          {
            "@type": "Continent",
            "name": "Africa"
          },
          {
            "@type": "Country",
            "name": "United States"
          }
        ],
        "knowsAbout": [
          "Entrepreneurship",
          "Venture Development",
          "Innovation",
          "University Partnerships",
          "Founder Development",
          "Mentorship",
          "Business Partnerships",
          "Market Access",
          "Leadership Development",
          "International Collaboration"
        ]
      }
    </script>


    <!-- =====================================================
         STRUCTURED DATA — WEBSITE
    ====================================================== -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "@id": "https://continentalfounders.org/#website",
        "url": "https://continentalfounders.org/",
        "name": "Continental Founders",
        "publisher": {
          "@id": "https://continentalfounders.org/#organization"
        },
        "inLanguage": "en"
      }
    </script>
  </head>

  <body>

         NOSCRIPT

    <noscript>
      Continental Founders connects founders, universities,

    ====================================================== -->

    <div id="root"></div>


    <!-- =====================================================
         APPLICATION
    ====================================================== -->

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
