<!doctype html>
<html lang="en">
  <head>
    <!-- =====================================================
         BASIC DOCUMENT SETTINGS
    ====================================================== -->

    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="theme-color"
      content="#071A2B"
    />

    <meta
      name="color-scheme"
      content="light"
    />

    <!-- =====================================================
         PRIMARY SEO
    ====================================================== -->

    <title>
      Continental Founders™ | Africa–America Strategic Partnerships
    </title>

    <meta
      name="description"
      content="Continental Founders™ connects universities, entrepreneurs, investors, institutions, and strategic partners across Africa and America through entrepreneurship, innovation, leadership development, and cross-continental collaboration."
    />

    <meta
      name="keywords"
      content="Continental Founders, Africa America partnerships, university partnerships, entrepreneurship, innovation, leadership development, African universities, American universities, cross continental collaboration, student entrepreneurship, global founders"
    />

    <meta
      name="author"
      content="Continental Founders™"
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <link
      rel="canonical"
      href="https://continentalfounders.org/"
    />

    <!-- =====================================================
         FAVICON
    ====================================================== -->

    <link
      rel="icon"
      type="image/png"
      href="/assets/continental-founders-logo.png"
    />

    <link
      rel="apple-touch-icon"
      href="/assets/continental-founders-logo.png"
    />

    <!-- =====================================================
         OPEN GRAPH / SOCIAL SHARING
    ====================================================== -->

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="Continental Founders™ | Africa–America Strategic Partnerships"
    />

    <meta
      property="og:description"
      content="Building a connected ecosystem where universities, entrepreneurs, investors, and institutions across Africa and America collaborate to develop the next generation of globally minded founders, innovators, and leaders."
    />

    <meta
      property="og:url"
      content="https://continentalfounders.org/"
    />

    <meta
      property="og:site_name"
      content="Continental Founders™"
    />

    <meta
      property="og:image"
      content="https://continentalfounders.org/assets/continental-founders-social.jpg"
    />

    <meta
      property="og:image:alt"
      content="Continental Founders™ — Africa and America Strategic Partnerships"
    />

    <!-- =====================================================
         TWITTER / X
    ====================================================== -->

    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Continental Founders™ | Africa–America Strategic Partnerships"
    />

    <meta
      name="twitter:description"
      content="Connecting universities, entrepreneurs, investors, institutions, and leaders across Africa and America through entrepreneurship, innovation, and leadership development."
    />

    <meta
      name="twitter:image"
      content="https://continentalfounders.org/assets/continental-founders-social.jpg"
    />

    <!-- =====================================================
         PERFORMANCE
    ====================================================== -->

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <!-- =====================================================
         TYPOGRAPHY
         
         Institutional serif + modern sans-serif pairing.
    ====================================================== -->

    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap"
      rel="stylesheet"
    />

    <!-- =====================================================
         STRUCTURED DATA
    ====================================================== -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Continental Founders™",
        "alternateName": "Continental Founders",
        "url": "https://continentalfounders.org/",
        "logo": "https://continentalfounders.org/assets/continental-founders-logo.png",
        "description": "Continental Founders™ connects universities, entrepreneurs, investors, institutions, and strategic partners across Africa and America through entrepreneurship, innovation, leadership development, and cross-continental collaboration.",
        "areaServed": [
          {
            "@type": "Place",
            "name": "Africa"
          },
          {
            "@type": "Place",
            "name": "United States"
          }
        ],
        "knowsAbout": [
          "Entrepreneurship",
          "Innovation",
          "Leadership Development",
          "University Partnerships",
          "International Collaboration",
          "Cross-Cultural Collaboration",
          "Education",
          "Economic Opportunity"
        ]
      }
    </script>

  </head>

  <body>

    <!-- =====================================================
         APPLICATION ROOT
    ====================================================== -->

    <div id="root"></div>


    <!-- =====================================================
         JAVASCRIPT APPLICATION
    ====================================================== -->

    <script
      type="module"
      src="/src/main.jsx"
    ></script>

  </body>
</html>
